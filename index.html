<script>

    onload = () => {
        const c = setTimeout(() => {
            document.body.classList.remove("not-loaded");
            clearTimeout(c);
        }, 1000);
    };

    const texts = [

        "Halo...",
        "Selamat ulang tahun.",
        "Semoga hari ini menjadi hari yang indah.",
        "Semoga semua harapanmu tercapai.",
        "Dan semoga tahun ini menjadi lebih baik."

    ];


    const container =
        document.getElementById("typingContainer");


    let lineIndex = 0;
    let characterIndex = 0;


    function typeLine() {

        // Kalau semua baris sudah selesai
        if (lineIndex >= texts.length) {

            return;

        }


        // Membuat elemen baris baru
        let line =
            document.createElement("div");

        line.classList.add("line");

        container.appendChild(line);


        // Membuat cursor
        let cursor =
            document.createElement("span");

        cursor.classList.add("cursor");

        line.appendChild(cursor);


        // Mengetik karakter satu per satu
        function typeCharacter() {

            if (
                characterIndex <
                texts[lineIndex].length
            ) {

                cursor.insertAdjacentText(
                    "beforebegin",
                    texts[lineIndex][characterIndex]
                );

                characterIndex++;

                setTimeout(
                    typeCharacter,
                    80
                );

            }

            else {

                // Hapus cursor dari baris sebelumnya
                cursor.remove();

                // Pindah ke baris berikutnya
                lineIndex++;

                characterIndex = 0;


                // Jeda sebelum baris berikutnya
                setTimeout(
                    typeLine,
                    1000
                );

            }

        }


        typeCharacter();

    }
    // Mulai animasi
    typeLine();
</script>
